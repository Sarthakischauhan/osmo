[project]
name = "symphony-server"
version = "0.1.0"
description = "Osmo's Symphony server: owns the Grok realtime session, runs tools, validates widgets"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "core-server",
    "symphony-core==0.0.7",
    "symphony-harness==0.0.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "infisicalsdk>=1.0.17",
    "langfuse==5.0.4",
    # Note vaults: the file watcher that keeps the search index fresh.
    "watchfiles>=1.0",
    # The local calendar: RRULE expansion and .ics import/export; tzdata gives zoneinfo its zones where the OS has none.
    "python-dateutil>=2.9",
    "icalendar>=6.1",
    "tzdata>=2024.1",
    # Tags and cover art of the user's music files.
    "mutagen>=1.47",
    # Host names as Chrome encodes them (IDNA2008, UTS #46), for the browser's site rules and network guard.
    # 3.7 is the first release without the quadratic-time encode (CVE-2024-3651).
    "idna>=3.7,<4",
]

[project.scripts]
symphony-server = "symphony_server.__main__:main"

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54,<1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["symphony_server"]
mypy_path = "src"
# symphony-core's ModelRegistry.__init__ has no annotations (core_ai/registry.py, outside #166's scope).
untyped_calls_exclude = ["core_ai.registry"]

# infisicalsdk ships no type information (no py.typed); the store types the slice it uses as Protocols.
[[tool.mypy.overrides]]
module = ["infisical_sdk", "infisical_sdk.*", "mutagen", "mutagen.*"]
ignore_missing_imports = true


# symphony-core (imported as core_ai) and symphony-harness are the PyPI 0.0.7 releases pinned in
# dependencies. core-server lists both too, and uv takes their `{ workspace = true }` sources from the
# symphony checkout it comes from, which would lock them to that git rev; the override makes every
# requirement for them the PyPI release. core-server comes from the symphony rev whose core_server is
# byte-identical to the vendored copy, because the vendored pyproject's `{ workspace = true }` sources
# only resolve inside symphony's workspace.
[tool.uv]
override-dependencies = ["symphony-core==0.0.7", "symphony-harness==0.0.7"]

[tool.uv.sources]
core-server = { git = "https://github.com/Sarthakischauhan/symphony", rev = "9fb6c8bf2faac74b41bf1b52eb68e6e52946cc31", subdirectory = "core_server" }
