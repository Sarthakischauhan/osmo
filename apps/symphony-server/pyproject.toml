[project]
name = "symphony-server"
version = "0.1.0"
description = "Osmo's Symphony server: owns the Grok realtime session, runs tools, validates widgets"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "core-server",
    "symphony-core==0.0.4",
    "symphony-harness",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "infisicalsdk>=1.0.17",
    "langfuse==5.0.4",
]

[project.scripts]
symphony-server = "symphony_server.__main__:main"

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54,<1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["symphony_server"]
mypy_path = "src"
# symphony-core's ModelRegistry.__init__ has no annotations (core_ai/registry.py, outside #166's scope).
untyped_calls_exclude = ["core_ai.registry"]

# infisicalsdk ships no type information (no py.typed); the store types the slice it uses as Protocols.
[[tool.mypy.overrides]]
module = ["infisical_sdk", "infisical_sdk.*"]
ignore_missing_imports = true


# symphony-core (imported as core_ai) is the PyPI release pinned in dependencies. core-server and
# symphony-harness list symphony-core too, and uv takes their `{ workspace = true }` source for it from the
# symphony checkout they come from, which would lock it to that git rev; the override makes every
# requirement for it the PyPI release. `uv sync` resolves symphony-harness at the symphony rev
# requirements.txt pins (its 0.0.1 on PyPI is not that code). core-server comes from the same rev (its
# core_server is byte-identical to the vendored a335957 copy), because the vendored pyproject's
# `{ workspace = true }` sources only resolve inside symphony's workspace.
[tool.uv]
override-dependencies = ["symphony-core==0.0.4"]

[tool.uv.sources]
core-server = { git = "https://github.com/Sarthakischauhan/symphony", rev = "c69034780524a6093ee598bbeba67aba8c66226b", subdirectory = "core_server" }
symphony-harness = { git = "https://github.com/Sarthakischauhan/symphony", rev = "c69034780524a6093ee598bbeba67aba8c66226b", subdirectory = "core_harness" }
