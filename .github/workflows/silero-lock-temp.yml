name: Update Silero lockfile (temporary)
on:
  push:
    branches:
      - feat/local-silero-vad
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - name: Resolve pinned VAD dependencies
        run: bun install
      - name: Commit generated bun.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock local Silero VAD dependencies"
            git push origin HEAD:feat/local-silero-vad
          fi
