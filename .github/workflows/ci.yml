name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: make typecheck
      - run: make test
      - run: make build
  symphony-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/symphony-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv
      - run: uv pip install --no-sources -p .venv -r requirements.txt
      - name: vendored core_server is unmodified
        working-directory: .
        run: |
          git clone -q https://github.com/Sarthakischauhan/symphony /tmp/symphony
          git -C /tmp/symphony checkout -q a335957c53009d6c4f82e8176a9abf975b736979
          diff -r /tmp/symphony/core_server vendor/core_server
      - run: .venv/bin/mypy
      - run: .venv/bin/python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osmo .
      - name: container serves the web app and core_server health
        run: |
          # Any provider key satisfies core_server's registry at boot; this one is a dummy that never leaves the runner.
          docker run -d --name osmo -p 8080:8080 -e XAI_API_KEY=ci-dummy osmo
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
