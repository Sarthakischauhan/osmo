[project]
name = "core-server"
version = "0.4.0"
description = "FastAPI framework for managed Symphony chat runs and replayable harness events (import as core_server; workspace-only, not published)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sarthak Chauhan", email = "sarthakchauhann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "symphony-core",
    "symphony-harness",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/Sarthakischauhan/symphony"
Documentation = "https://github.com/Sarthakischauhan/symphony/blob/main/docs/packages/core-server.md"
Source = "https://github.com/Sarthakischauhan/symphony/tree/main/core_server"

[project.scripts]
core-server = "core_server.__main__:main"

[tool.uv.sources]
symphony-core = { workspace = true }
symphony-harness = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
